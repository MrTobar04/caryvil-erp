name: caryvil-erp

services:
  db:
    image: postgres:16-alpine
    container_name: caryvil-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - caryvil-net
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: ./infra/docker/Dockerfile
    container_name: caryvil-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: ${POSTGRES_HOST:-db}
      DB_PORT: ${POSTGRES_PORT:-5432}
      PORT: ${ODOO_HTTP_PORT:-8069}
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo_dev_password_2026}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-caryvil_dev}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_caryvil_secret_2026}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ../../custom_addons:/mnt/extra-addons
      - ../config:/etc/odoo
      - ../docker/entrypoint.sh:/entrypoint.sh
    ports:
      - "8069:8069"
      - "8072:8072"
    networks:
      - caryvil-net
    restart: unless-stopped

volumes:
  odoo-db-data:
    name: caryvil_odoo_db_data
  odoo-web-data:
    name: caryvil_odoo_web_data

networks:
  caryvil-net:
    name: caryvil_network
    driver: bridge
